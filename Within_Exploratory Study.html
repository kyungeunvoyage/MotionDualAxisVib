<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Exploratory Study Runner · VCA Directionality</title>
    <style>
        :root {
            --bg: #0b0f14;
            --fg: #e5eef7;
            --muted: #99a7b5;
            --accent: #7bd3ff;
            --card: #121822;
            --ok: #75e39c
        }

        body {
            margin: 0;
            font-family: Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
            background: var(--bg);
            color: var(--fg)
        }

        header {
            padding: 16px 20px;
            border-bottom: 1px solid #1f2a38;
            position: sticky;
            top: 0;
            background: linear-gradient(180deg,rgba(11,15,20,.95),rgba(11,15,20,.85));
            backdrop-filter: blur(8px)
        }

        h1 {
            margin: 0;
            font-size: 20px;
            letter-spacing: .2px
        }

        main {
            padding: 20px;
            display: grid;
            gap: 16px;
            grid-template-columns: 420px 1fr
        }

        section {
            background: var(--card);
            border: 1px solid #1b2633;
            border-radius: 14px;
            padding: 16px
        }

            section h2 {
                margin: 0 0 10px;
                font-size: 16px;
                color: var(--accent)
            }

        .row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap
        }

        input, button {
            background: #0d131c;
            color: #fff;
            border: 1px solid #223042;
            border-radius: 10px;
            padding: 8px 10px;
            font-size: 14px
        }

        button {
            background: #0e1621;
            cursor: pointer;
            transition: .15s ease
        }

            button.primary {
                background: #143047;
                border-color: #1e4b6d
            }

            button:hover {
                transform: translateY(-1px)
            }

        .big {
            font-size: 28px;
            font-weight: 800
        }

        .hidden {
            display: none !important
        }

        .sep {
            height: 1px;
            background: #1b2633;
            margin: 10px 0
        }

        .panel {
            padding: 10px;
            border: 1px dashed #273447;
            border-radius: 12px;
            margin-bottom: 12px
        }

        #stateLine {
            display: flex;
            justify-content: center;
            align-items: baseline;
            gap: 16px;
            padding: 10px 8px
        }

        #blockBadgeBig {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: .5px;
            padding: 6px 12px;
            border-radius: 999px;
            border: 2px solid #2a5f85;
            background: #0e1621;
            color: #bfe7ff
        }

        #axisBadge {
            font-size: 13px;
            color: #bfe7ff;
            opacity: .85
        }

        .scale-btn {
            flex: 1;
            min-width: 30px;
            padding: 10px;
            border-radius: 8px;
            background: #0e1621;
            border: 1px solid #223042;
            cursor: pointer
        }

            .scale-btn.active {
                background: var(--accent);
                color: #000;
                font-weight: bold
            }

        .respSel {
            border-color: #2f95da;
            box-shadow: 0 0 0 2px rgba(47,149,218,.25) inset
        }

        .hint {
            font-size: 12px;
            color: var(--muted)
        }
    </style>
</head>
<body>
    <header>
        <h1>Exploratory Study Runner · VCA Directionality <span class="badge" id="serialStatus">미연결</span></h1>
    </header>

    <main>
        <section>
            <h2>① 세션 설정</h2>
            <div class="row">
                <label>Participant ID&nbsp;<input id="pid" placeholder="P01" /></label>
            </div>
            <div class="sep"></div>
            <div class="row">
                <button id="btnConnect" class="primary">시리얼 연결</button>
                <button id="btnStart">세션 시작</button>
                <button id="btnDownload">CSV 저장</button>
                <label style="display:flex;align-items:center;gap:6px;margin-left:auto;">
                    <input type="checkbox" id="demoMode" /> 데모 모드
                </label>
            </div>
            <div class="hint" style="margin-top:8px">
                <!--홀수 PID: A A · B B · A A · B B / 짝수 PID: B B · A A · B B · A A -->
            </div>
        </section>

        <section>
            <h2>② 진행 패널</h2>
            <div id="stateLine">
                <div id="phase" class="big">대기</div>
                <div id="blockBadgeBig">Block ?</div>
            </div>
            <!----><div class="center" id="axisBadge">Ulnar=?, Radial=? </div>
            <div class="sep"></div>

            <div id="stimPanel" class="panel center hidden">
                <div class="row" style="justify-content:center; gap:12px;">
                    <button id="btnPlay" class="primary">자극 재생</button>
                    <span id="playHint" class="hint"></span>
                </div>
            </div>

            <div id="responsePanel" class="center hidden">
                <div class="row center" style="justify-content:center; gap:14px; flex-wrap:wrap;">
                    <!-- 항상 4개 버튼 -->
                    <button id="btnUp" class="respBtn" style="min-width:120px;">Upwards (Z+)</button>
                    <button id="btnDown" class="respBtn" style="min-width:120px;">Downwards (Z−)</button>
                    <button id="btnForward" class="respBtn" style="min-width:120px;">Forwards (Y+)</button>
                    <button id="btnBackward" class="respBtn" style="min-width:120px;">Backwards (Y−)</button>
                </div>
                <div style="margin-top:16px;">
                    <div class="hint">확신도 선택 (1–7):</div>
                    <div class="row" style="justify-content:center; gap:6px; margin-top:6px;">
                        <button class="scale-btn" data-val="1">1</button>
                        <button class="scale-btn" data-val="2">2</button>
                        <button class="scale-btn" data-val="3">3</button>
                        <button class="scale-btn" data-val="4">4</button>
                        <button class="scale-btn" data-val="5">5</button>
                        <button class="scale-btn" data-val="6">6</button>
                        <button class="scale-btn" data-val="7">7</button>
                    </div>
                    <div class="row" style="justify-content:center; gap:10px; margin-top:12px;">
                        <button id="btnNext" class="primary" disabled>다음 ▶</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        // ===== helpers =====
        const $ = s => document.querySelector(s);
        const $$ = s => document.querySelectorAll(s);
        const sleep = ms => new Promise(r => setTimeout(r, ms));

        // 응답 버튼 라벨 → (axis, sign) 매핑
        const RESP_META = {
            Up: { axis: 'Z', sign: +1 },
            Down: { axis: 'Z', sign: -1 },
            Forward: { axis: 'Y', sign: +1 },
            Backward: { axis: 'Y', sign: -1 },
        };

        // 자극의 진짜 라벨(사람이 읽기 쉬움)
        function trueLabel(axis, sign) {
            if (axis === 'Z') return sign > 0 ? 'Up' : 'Down';
            return sign > 0 ? 'Forward' : 'Backward';
        }


        // ===== serial state =====
        let port, writer;
        let demo = false;

        // ===== experiment state =====
        let trials = [];
        let currentIndex = -1;
        let currentConf = null;
        let chosenRespLabel = null, chosenRespSign = null;

        // playback / RT
        let isPlaying = false;
        let playCount = 0;
        let totalPulses = 0;
        let lastStimEndTs = 0;

        // ===== PID 홀짝 → 블록 시퀀스 =====
        function pidIsOdd() {
            const pid = ($('#pid').value || '').toUpperCase();
            const m = pid.match(/\d+/);
            if (!m) { alert('Participant ID에 숫자가 필요합니다. 예: P01, P12'); throw new Error('PID missing number'); }
            return (parseInt(m[0], 10) % 2) === 1;
        }

        // ===== serial utils =====
        async function sendByte(n) {
            if (demo) { await sleep(10); return; }
            if (!writer) return;
            const buf = new Uint8Array([n & 0xff]);
            await writer.write(buf);
        }
        async function connectSerial() {
            try {
                demo = $('#demoMode')?.checked === true;
                if (demo) {
                    $('#serialStatus').textContent = '데모';
                    $('#serialStatus').style.color = 'var(--ok)';
                    alert('데모 모드: 시리얼 없이 진행합니다. 이제 세션 시작을 누르세요.');
                    return;
                }
                if (!('serial' in navigator)) return;
                if (location.protocol !== 'https:' && !['localhost', '127.0.0.1'].includes(location.hostname)) {
                    alert('Web Serial은 HTTPS 또는 http://localhost 에서만 동작합니다.'); return;
                }
                const p = await navigator.serial.requestPort();
                await p.open({ baudRate: 115200 });
                port = p; writer = port.writable.getWriter();
                $('#serialStatus').textContent = '연결됨';
                $('#serialStatus').style.color = 'var(--ok)';
                alert('시리얼 연결 성공: 이제 세션 시작 버튼을 누르세요.');
            } catch (e) {
                console.error(e);
                alert('Serial 연결 실패: 포트/권한을 확인하세요.\n' + (e?.message || e));
            }
        }

        // ===== random =====
        function shuffle(a) {
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        // ===== block → axis 매핑(자동) =====
        const AXIS_FOR_BLOCK = {
            A: { ulnar: 'Y', radial: 'Z' }, // A = (Ulnar=Y, Radial=Z)
            B: { ulnar: 'Z', radial: 'Y' }  // B = (Ulnar=Z, Radial=Y)
        };
        function updateAxisBadge(blockLabel) {
            const m = AXIS_FOR_BLOCK[blockLabel];
            $('#blockBadgeBig').textContent = `Block ${blockLabel}`;
            $('#axisBadge').textContent = `Ulnar=${m.ulnar}, Radial=${m.radial} (자동)`;
        }

        // ===== 트라이얼 빌드 =====
        // 홀수: A,B,A,B → 각 항목을 2회씩 펼쳐서 A,A,B,B,A,A,B,B (짝수는 반대)
        // 각 세션=24트라이얼(12코드×2), 트라이얼마다 side 교대, waveform/부호는 24개 전체 셔플
        function buildTrials() {
            trials = [];
            const pid = $('#pid').value || 'P00';
            const odd = pidIsOdd();
            const macro = odd ? ['A', 'B', 'A', 'B'] : ['B', 'A', 'B', 'A'];
            const blockOrder = macro.flatMap(b => [b, b]); // 8 세션

            let sessionNo = 0;
            for (const blockLabel of blockOrder) {
                sessionNo += 1;

                // 12코드(6 wf × ±) 만들고 두 번 복제 후 전체 셔플 → 24개
                const codes12 = [];
                for (let wf = 1; wf <= 6; wf++) {
                    codes12.push({ wf, sign: +1, code: (wf - 1) * 2 + 0 });
                    codes12.push({ wf, sign: -1, code: (wf - 1) * 2 + 1 });
                }
                const codes24 = shuffle([...codes12, ...codes12]);

                // 이 세션 시작 side: A→ulnar, B→radial
                let nextSide = (blockLabel === 'A') ? 'ulnar' : 'radial';

                let trialInSession = 0;
                for (const item of codes24) {
                    trialInSession += 1;
                    const side = nextSide;
                    const axis = AXIS_FOR_BLOCK[blockLabel][side];

                    trials.push({
                        participant_id: pid,
                        session_no: sessionNo,
                        block: blockLabel,
                        side,
                        axis,
                        waveform: item.wf,
                        sign: item.sign,
                        true_dir: item.sign,
                        code: item.code,
                        side_byte: (side === 'ulnar') ? 0 : 1,
                        trial_in_session: trialInSession
                    });

                    nextSide = (nextSide === 'ulnar') ? 'radial' : 'ulnar';
                }
            }

            currentIndex = -1;
            updateAxisBadge(blockOrder[0]);
            console.log('[INIT] sessions=', new Set(trials.map(t => t.session_no)).size, 'trials=', trials.length); // 8, 192
        }

        async function startSession() {
            demo = $('#demoMode')?.checked === true;
            if (!demo && !port) { alert('먼저 시리얼 연결을 해주세요'); return; }
            buildTrials();
            nextTrial();
        }

        async function nextTrial() {
            if (currentIndex >= 0) {
                const cur = trials[currentIndex];
                const nxt = trials[currentIndex + 1];
                const isBoundary = !nxt || (nxt.session_no !== cur.session_no);
                if (isBoundary) {
                    const isBlockSwitch = !!nxt && (nxt.block !== cur.block);
                    let msg = `세션 ${cur.session_no} 완료`;
                    if (isBlockSwitch) msg += `\n[블록 전환] ${cur.block} → ${nxt.block}\n(배치를 변경해주세요!)`;
                    const cont = confirm(msg + '\n계속 진행할까요?');
                    if (!cont) {
                        $('#phase').textContent = `일시중지`;
                        $('#responsePanel').classList.add('hidden');
                        $('#stimPanel').classList.add('hidden');
                        return;
                    }
                    if (isBlockSwitch) updateAxisBadge(nxt.block);
                }
            }

            currentIndex++;
            if (currentIndex >= trials.length) {
                $('#phase').textContent = '전체 세션 종료';
                $('#responsePanel').classList.add('hidden');
                $('#stimPanel').classList.add('hidden');
                alert('전체 세션 종료');
                console.log('[DONE] all sessions complete');
                return;
            }

            const t = trials[currentIndex];
            $('#phase').textContent = '설정/재생 대기';

            // 응답 UI 리셋
            chosenRespLabel = null; chosenRespSign = null; currentConf = null;
            $$('.respBtn').forEach(b => b.classList.remove('respSel'));
            $$('.scale-btn').forEach(b => b.classList.remove('active'));
            $('#btnNext').disabled = true;

            $('#stimPanel').classList.remove('hidden');
            $('#responsePanel').classList.add('hidden');

            isPlaying = false; playCount = 0; totalPulses = 0; lastStimEndTs = 0;
            $('#playHint').textContent = '';
        }

        // ===== playback =====
        async function playStimulus() {
            if (isPlaying) return;
            const t = trials[currentIndex];

            isPlaying = true;
            $('#btnPlay').disabled = true;
            $('#phase').textContent = demo ? '자극 중… (데모)' : '자극 중…';

            const code = (t.waveform - 1) * 2 + (t.sign > 0 ? 0 : 1); // 0..11
            const sideByte = (t.side === 'ulnar') ? 0 : 1;            // 0=A22, 1=A21
            await sendByte(code);
            await sendByte(sideByte);
            console.log('[SEND]', { code, sideByte, side: t.side, axis: t.axis, block: t.block });


            playCount += 1;
            totalPulses += 1;
            lastStimEndTs = performance.now();
            $('#playHint').textContent = `재생 ${playCount}회`;

            $('#responsePanel').classList.remove('hidden');
            $('#phase').textContent = '응답 대기';
            isPlaying = false;
            $('#btnPlay').disabled = false;
        }

        function selectConfidence(val) {
            currentConf = val;
            $$('.scale-btn').forEach(btn => {
                if (parseInt(btn.dataset.val) === val) btn.classList.add('active');
                else btn.classList.remove('active');
            });
            updateNextEnabled();
        }

        function chooseResponse(respLabel, respSign) {
            chosenRespLabel = respLabel;
            chosenRespSign = respSign;
            $$('.respBtn').forEach(b => b.classList.remove('respSel'));
            const map = { Up: '#btnUp', Down: '#btnDown', Forward: '#btnForward', Backward: '#btnBackward' };
            const el = document.querySelector(map[respLabel]);
            if (el) el.classList.add('respSel');
            updateNextEnabled();
        }

        function updateNextEnabled() {
            $('#btnNext').disabled = !(chosenRespSign !== null && currentConf !== null);
        }

        // ===== CSV 고정 스키마 =====
        const CSV_COLUMNS = [
            'timestamp', 'participant_id', 'session_no', 'block',
            'side', 'axis', 'waveform', 'sign', 'true_dir', 'true_label',
            'response_label', 'response_axis', 'response_dir', 'axis_match', 'correct',
            'rt_ms', 'confidence', 'play_count', 'total_pulses', 'code',
            'side_byte', 'demo_mode', 'notes'
        ];

        function toCSV(rows) {
            if (!rows.length) return '';
            const header = CSV_COLUMNS.join(',');
            const esc = v => { if (v == null) return ''; const s = String(v); return /[",\n]/.test(s) ? '"' + s.replaceAll('"', '""') + '"' : s; };
            const lines = rows.map(r => CSV_COLUMNS.map(c => esc(r[c])).join(','));
            return header + '\n' + lines.join('\n');
        }
        function downloadBlob(text, filename, mime = 'text/csv;charset=utf-8;') {
            const blob = new Blob([text], { type: mime });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob); a.download = filename;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
        }

        // ===== 데이터 누적 =====
        let rows = [];
        async function commitAndNext() {
            const t = trials[currentIndex];
            const rt = lastStimEndTs ? Math.max(0, Math.round(performance.now() - lastStimEndTs)) : '';

            if (chosenRespLabel == null || currentConf == null) {
                alert('방향성 응답과 확신도를 모두 선택해주세요.');
                return;
            }

            // 응답을 축/부호로 해석
            const resp = RESP_META[chosenRespLabel];              // {axis, sign}
            const axisMatch = resp && (resp.axis === t.axis);     // 응답한 축이 자극 축과 같은가?
            const isCorrect = (axisMatch && resp.sign === t.sign) ? 1 : 0;

            const row = {
                timestamp: new Date().toISOString(),
                participant_id: t.participant_id,
                session_no: t.session_no,
                block: t.block,
                side: t.side,
                axis: t.axis,                       // 자극 축 (Y or Z)
                waveform: Number(t.waveform),
                sign: Number(t.sign),               // 자극 부호 (+1 / -1)
                true_dir: Number(t.sign),
                true_label: trueLabel(t.axis, t.sign),      // ← 사람이 읽기 쉬운 정답 라벨

                response_label: chosenRespLabel,            // 사용자가 누른 실제 버튼 라벨
                response_axis: resp.axis,                   // ← 응답 축 (Y or Z)
                response_dir: Number(resp.sign),            // 응답 부호 (+1/-1)
                axis_match: axisMatch ? 1 : 0,              // ← 축 일치 여부(0/1)
                correct: isCorrect,                         // ← 최종 정오표시

                rt_ms: rt,
                confidence: Number(currentConf),
                play_count: Number(playCount),
                total_pulses: Number(totalPulses),
                code: Number(t.code),
                side_byte: (t.side === 'ulnar') ? 0 : 1,
                demo_mode: demo ? 1 : 0,
                notes: ''
            };
            rows.push(row);
            console.log('[COMMIT]', row);

            $('#responsePanel').classList.add('hidden');
            $('#stimPanel').classList.add('hidden');
            $('#phase').textContent = '휴지';
            await sleep(200);
            nextTrial();
        }


        // ===== events =====
        $('#btnConnect').addEventListener('click', connectSerial);
        $('#btnStart').addEventListener('click', startSession);
        $('#btnDownload').addEventListener('click', () => {
            const csv = toCSV(rows);
            if (!csv) { alert('저장할 데이터가 없습니다'); return; }
            const pid = $('#pid').value || 'P00';
            downloadBlob(csv, `${pid}_exploratory_raw.csv`);
        });
        $('#btnPlay').addEventListener('click', playStimulus);

        $('#btnUp').onclick = () => chooseResponse('Up', +1);
        $('#btnDown').onclick = () => chooseResponse('Down', -1);
        $('#btnForward').onclick = () => chooseResponse('Forward', +1);
        $('#btnBackward').onclick = () => chooseResponse('Backward', -1);

        $$('.scale-btn').forEach(btn => btn.addEventListener('click', () => selectConfidence(parseInt(btn.dataset.val))));
        $('#btnNext').addEventListener('click', commitAndNext);
    </script>
</body>
</html>
