<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Exploratory Study Runner · VCA Directionality</title>
    <style>
        :root {
            --bg: #0b0f14;
            --fg: #e5eef7;
            --muted: #99a7b5;
            --accent: #7bd3ff;
            --card: #121822;
            --ok: #75e39c;
            --warn: #ffd36a;
            --err: #ff8b8b;
        }

        body {
            margin: 0;
            font-family: Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
            background: var(--bg);
            color: var(--fg);
        }

        header {
            padding: 16px 20px;
            border-bottom: 1px solid #1f2a38;
            position: sticky;
            top: 0;
            background: linear-gradient(180deg, rgba(11,15,20,.95), rgba(11,15,20,.85));
            backdrop-filter: blur(8px);
        }

        h1 {
            margin: 0;
            font-size: 20px;
            letter-spacing: .2px;
        }

        main {
            padding: 20px;
            display: grid;
            gap: 16px;
            grid-template-columns: 360px 1fr;
        }

        section {
            background: var(--card);
            border: 1px solid #1b2633;
            border-radius: 14px;
            padding: 16px;
        }

            section h2 {
                margin: 0 0 10px;
                font-size: 16px;
                color: var(--accent);
            }

        .row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        label {
            font-size: 13px;
            color: var(--muted);
        }

        input, select, button {
            background: #0d131c;
            color: var(--fg);
            border: 1px solid #223042;
            border-radius: 10px;
            padding: 8px 10px;
            font-size: 14px;
        }

        button {
            background: #0e1621;
            cursor: pointer;
            transition: .15s ease;
        }

            button.primary {
                background: #143047;
                border-color: #1e4b6d;
            }

            button:hover {
                transform: translateY(-1px);
            }

        .grid2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .badge {
            font-size: 12px;
            padding: 3px 8px;
            border-radius: 999px;
            border: 1px solid #294059;
            color: #bfe7ff;
        }

        .big {
            font-size: 24px;
            font-weight: 700;
        }

        .center {
            text-align: center;
        }

        .hidden {
            display: none !important;
        }

        .sep {
            height: 1px;
            background: #1b2633;
            margin: 10px 0;
        }

        .warn {
            color: var(--warn);
        }

        .ok {
            color: var(--ok);
        }
    </style>
</head>
<body>
    <header>
        <h1>Exploratory Study Runner · VCA Directionality <span class="badge" id="serialStatus">미연결</span></h1>
    </header>
    <main>
        <section>
            <h2>① 세션 설정</h2>
            <div class="grid2">
                <label>Participant ID<br><input id="pid" placeholder="P001" /></label>
                <label>
                    Block 순서<br>
                    <select id="blockOrder">
                        <option value="UR">A: Ulnar → B: Radial</option>
                        <option value="RU">A: Radial → B: Ulnar</option>
                    </select>
                </label>
            </div>
            <div class="grid2" style="margin-top:8px;">
                <label>
                    Ulnar 축 (Y=앞/뒤, Z=위/아래)<br>
                    <select id="axisU"><option>Y</option><option>Z</option></select>
                </label>
                <label>
                    Radial 축 (Y=앞/뒤, Z=위/아래)<br>
                    <select id="axisR"><option>Y</option><option>Z</option></select>
                </label>
            </div>
            <div class="sep"></div>
            <div class="row">
                <button id="btnConnect" class="primary">시리얼 연결</button>
                <button id="btnStart">세션 시작</button>
                <button id="btnDownload">CSV 저장</button>
            </div>
            <p style="margin-top:8px;" class="warn">* Web Serial은 Chromium 기반 브라우저(Chrome/Edge/Whale 등)에서만 지원됩니다.</p>
        </section>

        <section>
            <h2>② 진행 패널</h2>
            <div id="stateBox" class="center" style="padding:10px 8px;">
                <div class="big" id="phase">대기</div>
            </div>
            <div class="sep"></div>

            <div id="responsePanel" class="center hidden">
                <div class="row center" style="justify-content:center; gap:14px; flex-wrap:wrap;">
                    <button id="btnUp" style="min-width:120px;">위 (Z+)</button>
                    <button id="btnDown" style="min-width:120px;">아래 (Z−)</button>
                    <button id="btnForward" style="min-width:120px;">앞 (Y+)</button>
                    <button id="btnBackward" style="min-width:120px;">뒤 (Y−)</button>
                </div>
                <div class="row center" style="justify-content:center; margin-top:10px; gap:10px;">
                    <label>확신도 (1–7): <span id="confVal">4</span></label>
                    <div class="row" style="gap:6px;">
                        <button id="confDec">-1</button>
                        <span id="confDisplay" style="min-width:20px; text-align:center;">4</span>
                        <button id="confInc">+1</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        const $ = sel => document.querySelector(sel);
        const sleep = ms => new Promise(r => setTimeout(r, ms));

        let port, writer;
        let running = false;
        let trialStartTs = 0;

        const WAVEFORMS = [1, 2, 3, 4, 5, 6];
        const SIGNS = [+1, -1];
        let trials = [];
        let currentIndex = -1;
        const rows = [];
        const REPS_PER_COMBO = 1;
        let currentCond = '';

        async function connectSerial() {
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });
                writer = port.writable.getWriter();
                $('#serialStatus').textContent = '연결됨';
                $('#serialStatus').style.color = 'var(--ok)';
                alert('시리얼 연결 성공: 이제 세션 시작 버튼을 누르세요.');
            } catch (e) { alert('Serial 연결 실패: Chrome/Edge/Whale 브라우저인지 확인하고, COM 포트 선택/드라이버를 확인하세요.'); }
        }

        async function sendCommand(s) {
            if (!writer) return;
            const enc = new TextEncoder();
            await writer.write(enc.encode(s));
        }

        function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]]; } return a; }

        function buildTrials() {
            trials = [];
            const pid = $('#pid').value || 'P000';
            const orderUR = $('#blockOrder').value === 'UR';
            const axisU = $('#axisU').value;
            const axisR = $('#axisR').value;

            const blocks = orderUR ? [{ side: 'ulnar', axis: axisU }, { side: 'radial', axis: axisR }]
                : [{ side: 'radial', axis: axisR }, { side: 'ulnar', axis: axisU }];

            for (const b of blocks) {
                for (const wf of WAVEFORMS) {
                    for (const sgn of SIGNS) {
                        for (let r = 0; r < REPS_PER_COMBO; r++) {
                            trials.push({ participant_id: pid, block: b.side === 'ulnar' ? 'A' : 'B', stim_side: b.side, axis: b.axis, waveform: wf, sign: sgn });
                        }
                    }
                }
            }
            shuffle(trials);
            currentIndex = -1;
        }

        async function startSession() {
            if (!port) { alert('먼저 시리얼 연결을 해주세요'); return; }
            buildTrials();
            running = true;
            nextTrial();
        }

        async function nextTrial() {
            currentIndex++;
            if (currentIndex >= trials.length) {
                running = false;
                $('#phase').textContent = '세션 종료';
                $('#responsePanel').classList.add('hidden');
                alert('세션 종료');
                return;
            }

            const t = trials[currentIndex];
            $('#phase').textContent = `자극 중…`;
            currentCond = `${t.block} · ${t.stim_side} · ${t.axis} · WF${t.waveform} · sign ${t.sign > 0 ? '+' : '−'}`;
            $('#responsePanel').classList.add('hidden');

            const trig = t.sign > 0 ? '0' : '1';
            await sendCommand(trig);
            trialStartTs = performance.now();
            await sleep(500);

            $('#responsePanel').classList.remove('hidden');
            $('#phase').textContent = '응답 대기';
            $('#confVal').textContent = '4';
            $('#confDisplay').textContent = '4';
        }

        function handleResponse(respLabel, respSign) {
            const t = trials[currentIndex];
            const rt = Math.round(performance.now() - trialStartTs);
            const conf = parseInt($('#confDisplay').textContent);
            const row = {
                timestamp: new Date().toISOString(),
                participant_id: t.participant_id,
                block: t.block,
                stim_side: t.stim_side,
                axis: t.axis,
                waveform: t.waveform,
                sign: t.sign,
                true_dir: t.sign,
                response_label: respLabel,
                response_dir: respSign,
                correct: (respSign === t.sign) ? 1 : 0,
                rt_ms: rt,
                confidence: conf,
                condition_info: currentCond,
                notes: ''
            };
            rows.push(row);
            $('#responsePanel').classList.add('hidden');
            $('#phase').textContent = '휴지';
            sleep(250).then(nextTrial);
        }

        $('#btnUp').onclick = () => handleResponse('Up', +1);
        $('#btnDown').onclick = () => handleResponse('Down', -1);
        $('#btnForward').onclick = () => handleResponse('Forward', +1);
        $('#btnBackward').onclick = () => handleResponse('Backward', -1);

        $('#confDec').onclick = () => {
            let val = parseInt($('#confDisplay').textContent);
            if (val > 1) val--; $('#confDisplay').textContent = val; $('#confVal').textContent = val;
        };
        $('#confInc').onclick = () => {
            let val = parseInt($('#confDisplay').textContent);
            if (val < 7) val++; $('#confDisplay').textContent = val; $('#confVal').textContent = val;
        };

        function toCSV(rows) {
            if (!rows.length) return '';
            const cols = Object.keys(rows[0]);
            const header = cols.join(',');
            const esc = v => {
                if (v == null) return '';
                const s = String(v);
                return /[",\n]/.test(s) ? '"' + s.replaceAll('"', '""') + '"' : s;
            };
            const lines = rows.map(r => cols.map(c => esc(r[c])).join(','));
            return header + '\n' + lines.join('\n');
        }

        function downloadCSV() {
            const csv = toCSV(rows);
            if (!csv) { alert('저장할 데이터가 없습니다'); return; }
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const a = document.createElement('a');
            const pid = $('#pid').value || 'P000';
            a.href = URL.createObjectURL(blob);
            a.download = `${pid}_exploratory_raw.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        $('#btnConnect').addEventListener('click', connectSerial);
        $('#btnStart').addEventListener('click', startSession);
        $('#btnDownload').addEventListener('click', downloadCSV);

    </script>
</body>
</html>
