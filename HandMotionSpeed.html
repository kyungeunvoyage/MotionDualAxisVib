<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Main User Experiment – One-Way Bar + Serial/Demo</title>
    <style>
        :root {
            /* ===== Animation knobs ===== */
            --move-duration: 100ms; /* 좌→우, 우→좌 이동 시간 */
            --pause-duration: 3000ms; /* 되돌아가기 전에 대기 시간 */
            --track-width: min(90vw, 1100px);
            --track-height: 80px; /* 바 두께 */
            /* ===== Theme ===== */
            --bg: #0b0f14;
            --fg: #e5eef7;
            --muted: #99a7b5;
            --accent: #7bd3ff;
            --card: #121822;
            --ok: #75e39c;
        }

        html, body {
            height: 100%;
            margin: 0;
            background: var(--bg);
            color: var(--fg);
            font-family: Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
        }

        header {
            padding: 14px 18px;
            border-bottom: 1px solid #1f2a38;
            position: sticky;
            top: 0;
            background: linear-gradient(180deg,rgba(11,15,20,.95),rgba(11,15,20,.85));
            backdrop-filter: blur(8px)
        }

        h1 {
            margin: 0;
            font-size: 18px;
            letter-spacing: .2px
        }

        .badge {
            margin-left: 8px;
            padding: 2px 8px;
            border-radius: 999px;
            border: 1px solid #2a5f85;
            background: #0e1621;
            color: #bfe7ff;
            font-size: 12px
        }

        main {
            padding: 18px;
            display: grid;
            gap: 16px;
            grid-template-columns: 420px 1fr
        }

        section {
            background: var(--card);
            border: 1px solid #1b2633;
            border-radius: 14px;
            padding: 14px
        }

            section h2 {
                margin: 0 0 10px;
                font-size: 15px;
                color: var(--accent)
            }

        .row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap
        }

        input, button, select {
            background: #0d131c;
            color: #fff;
            border: 1px solid #223042;
            border-radius: 10px;
            padding: 8px 10px;
            font-size: 14px
        }

        button {
            background: #0e1621;
            cursor: pointer;
            transition: .15s ease
        }

            button.primary {
                background: #143047;
                border-color: #1e4b6d
            }

            button:hover {
                transform: translateY(-1px)
            }

        .hidden {
            display: none !important
        }

        .sep {
            height: 1px;
            background: #1b2633;
            margin: 10px 0
        }

        .title {
            font-size: clamp(18px, 2vw, 20px);
            opacity: .9;
            letter-spacing: .2px;
            margin-bottom: 10px
        }

        /* Direction panel */
        .dirpanel {
            margin: 10px 0 12px;
            padding: 14px;
            border-radius: 12px;
            background: #0e1621;
            border: 1px solid #223042;
            display: grid;
            gap: 10px
        }

        .dirrow {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            font-size: 18px;
        }

            .dirrow .arrow {
                font-size: 22px;
                opacity: .9
            }

            .dirrow .label {
                font-weight: 600
            }

        .dirsub {
            font-size: 12px;
            color: var(--muted);
            text-align: center
        }

        .title + .dirpanel {
            margin-top: 8px
        }

        .track {
            position: relative;
            width: var(--track-width);
            height: var(--track-height);
            /* track은 이제 배경만(또는 없음). outline은 rail이 가짐 */
        }

        /* rail은 bar의 기준 좌표계가 되므로 relative가 더 안전 */
        .rail {
            position: relative; /* <= 이걸로 바꿔도 됩니다(absolute여도 동작은 함) */
            left: 0;
            top: 0;
            height: var(--track-height);
            width: var(--rail-width, var(--track-width));
            border-radius: 999px;
            background: linear-gradient(to right, rgba(255,255,255,.08), rgba(255,255,255,.02));
            box-shadow: inset 0 0 0 2px rgba(255,255,255,.07);
            overflow: hidden;
        }

        /* 카운트다운 오버레이 */
        .countdown {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: clamp(32px, 6vw, 72px);
            color: #fff;
            text-shadow: 0 2px 8px rgba(0,0,0,.6);
            pointer-events: none;
            opacity: 0;
            transition: opacity .12s ease;
        }

        .countdown.show {
            opacity: 1;
        }

        .bar {
            position: absolute;
            top: 0;
            left: 0;
            width: var(--track-height);
            height: var(--track-height);
            border-radius: 50%;
            background: linear-gradient(135deg, #79c0ff, #9ae6b4); /* 복구 */
            box-shadow: 0 0 0 2px rgba(0,0,0,.25), 0 8px 20px rgba(64,162,255,.25); /* 복구 */
            z-index: 1; /* countdown 등과 겹칠 때 위로 */
        }

        .controls {
            display: flex;
            justify-content: flex-start;
            gap: 10px;
            margin-top: 10px
        }

        .btn {
            appearance: none;
            border: 0;
            border-radius: 999px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background: #2d6cdf;
            color: white;
            box-shadow: 0 6px 16px rgba(45,108,223,.35);
            transition: transform .06s ease, opacity .2s ease;
        }

            .btn:active {
                transform: translateY(1px)
            }

            .btn:disabled {
                opacity: .6;
                cursor: not-allowed
            }

        .kv {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px
        }

        .small {
            font-size: 12px;
            color: var(--muted)
        }

        .ok {
            color: var(--ok)
        }

        .toolbar {
            margin-top: 4px;
            margin-bottom: 10px;
            justify-content: flex-start;
            gap: 12px;
        }

        .btn.mode {
            transition: transform .06s ease, opacity .2s ease, box-shadow .2s ease, background-color .2s ease;
        }

            .btn.mode.active {
                background: #002575;
                box-shadow: 0 0 0 2px rgba(123, 211, 255, .35), 0 8px 16px rgba(45,108,223,.35);
            }

        .btn.start.running {
            background: #1e4b6d;
            box-shadow: 0 0 0 2px rgba(123, 211, 255, .25), 0 8px 16px rgba(30,75,109,.35);
            opacity: .95;
        }

        .btn.start:disabled {
            opacity: .7;
        }

        /* 클릭(누르고 있는 동안) 피드백 + 래치 */
        .btn.is-pressed {
            background: #00165e;
            box-shadow: 0 0 0 2px rgba(123,211,255,.35), 0 6px 14px rgba(45,108,223,.35);
            transform: translateY(1px);
        }

        .btn.latched {
            background: #1f3c8a;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,.08), 0 0 0 2px rgba(50,120,200,.35), 0 10px 18px rgba(30,70,140,.35);
        }

        /* ===== NEW: 방향 프리셋 칩 ===== */
        .chipbar {
            display: flex;
            gap: 10px;
            margin-bottom: 8px;
        }

        .bar.moving {
            background: linear-gradient(135deg, #ff4d4d, #ff8a8a);
            box-shadow: 0 0 0 2px rgba(0,0,0,.25), 0 8px 20px rgba(255,64,64,.30);
        }


        .chip {
            width: 36px;
            height: 36px;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 12px;
            border: 1px solid #223042;
            background: #0e1621;
            color: #cfe6ff;
            cursor: pointer;
            transition: transform .06s ease, box-shadow .2s ease, background .2s ease, color .2s ease;
        }

            .chip:hover {
                transform: translateY(-1px)
            }

            .chip.active {
                background: #143047;
                color: #fff;
                box-shadow: 0 0 0 2px rgba(123,211,255,.25);
            }
            .btn.choice { transition: transform .06s ease, opacity .2s ease, box-shadow .2s ease, background-color .2s ease; }
            .btn.choice.rep { background: #5a1f1f; box-shadow: 0 6px 16px rgba(255,64,64,.25); }
            .btn.choice.att { background: #1f4d2b; box-shadow: 0 6px 16px rgba(64,200,120,.25); }
            .btn.choice:disabled { opacity: .5; cursor: not-allowed; }

    </style>
</head>
<body>
    <header>
        <h1>Main User Experiment<span class="badge" id="serialStatus">미연결</span></h1>
    </header>

    <main>
        <!-- Left: Session & Serial Controls -->
        <section>
            <h2>① 세션 & 연결</h2>
            <div class="row">
                <label>Participant ID&nbsp;<input id="pid" placeholder="P01" /></label>
            </div>
            <div class="sep"></div>
            <div class="row">
                <button id="btnConnect" class="primary">시리얼 연결</button>
                <button id="btnStart">시작</button>
                <label style="display:flex;align-items:center;gap:6px;margin-left:auto;">
                    <input type="checkbox" id="demoMode" /> 데모 모드
                </label>
            </div>
            <div class="small" style="margin-top:6px">Web Serial: HTTPS 또는 http://localhost 에서만 동작</div>
            <div class="sep"></div>
            <h3 class="small" style="margin:0 0 6px">아두이노 전송 코드 설정</h3>
            <div class="kv">
                <label>LR 이동 code <input id="codeLR" type="number" min="0" max="255" value="0" /></label>
                <label>LR side <select id="sideLR"><option value="0">ulnar(0)</option><option value="1">radial(1)</option></select></label>
                <label>RL 이동 code <input id="codeRL" type="number" min="0" max="255" value="1" /></label>
                <label>RL side <select id="sideRL"><option value="0">ulnar(0)</option><option value="1" selected>radial(1)</option></select></label>
            </div>
            <div class="sep"></div>
            <button id="btnDownload">CSV 저장</button>
        </section>

        <!-- Right: Animation Panel -->
        <section>
            <h2>② 진행 패널</h2>

            <!-- ===== NEW: 방향 프리셋 칩 3개 ===== -->
            <div class="chipbar" id="dirChips">
                <button class="chip active" id="chipLR" title="Left/Right">L/R</button>
                <button class="chip" id="chipUD" title="Up/Down">U/D</button>
                <button class="chip" id="chipFB" title="Forward/Backward">F/B</button>
            </div>

            <!-- 상단 타이밍 컨트롤 바 -->
            <div class="controls toolbar" id="timingControls">
                <button id="btnAThenUI" class="btn mode" type="button" title="먼저 A 전송, 그 다음 UI">① Before Motion</button>
                <button id="btnUIOnly" class="btn mode" type="button" title="UI 애니메이션만 실행">② During Motion</button>
                <button id="btnUIThenA" class="btn mode" type="button" title="UI 끝난 직후 A 전송">③ After Motion</button>
            </div>

            <div class="controls toolbar" id="soaControls">
                <label>
                    SOA
                    <select id="soaSelect">
                        <option value="30">30 ms (키 4)</option>
                        <option value="50" selected>50 ms (키 5)</option>
                        <option value="70">70 ms (키 6)</option>
                        <option value="90">90 ms (키 7)</option>
                        <option value="110">110 ms (키 z)</option>
                        <option value="130">130 ms (키 Z)</option>
                    </select>
                </label>
                <label>
                    targetHz
                    <input id="targetHz" type="number" min="1" value="40" style="width:80px" />
                </label>
                <label style="display:flex;align-items:center;gap:6px;">
                    <input type="checkbox" id="syncSOA" checked />
                    두 자극 간 대기시간 SOA 반영
                </label>
                <label style="display:flex;align-items:center;gap:6px;">
                    <input type="checkbox" id="scaleDistanceBySOA" checked />
                    이동 거리도 SOA 비례(속도는 고정)
                </label>
            </div>


            <div class="title"></div>

            <!-- 방향 안내 패널 -->
            <div class="dirpanel" id="dirPanel">
                <div class="dirrow">
                    <span class="label" id="labelA">좌 (Left)</span>
                    <span id="arrowLine" class="arrow">→→→→→→→→→→→→→→→→→→</span>
                    <span class="label" id="labelB">우 (Right)</span>
                </div>
            </div>

            <div class="track" id="track" aria-label="animation-track">
                <div class="rail" id="rail">
                    <div class="bar" id="bar" role="img" aria-label="moving bar"></div>
                </div>
                <div class="countdown" id="countdown" aria-live="polite" aria-atomic="true"></div>
            </div>
            <div class="controls" id="statusRow">
                <span id="phaseText" class="small">대기</span>
            </div>

            <div class="controls" id="responseControls">
                <!--Q를 누르면-->
                <button id="btnRepulsive" class="btn choice rep" type="button" disabled>Repulsive</button>
                <!--J를 누르면-->
                <button id="btnAttractive" class="btn choice att" type="button" disabled>Attractive</button>
            </div>
            <div class="controls" id="runControls">
                <button id="startBtn" class="btn start">다음</button>
            </div>

        </section>
    </main>

    <script>
        (function () {
            // ===== Utilities =====
            const $ = s => document.querySelector(s);
            const sleep = ms => new Promise(r => setTimeout(r, ms));
            const toPx = (n) => Number.isFinite(n) ? n + 'px' : '0px';
            const ensureNumber = (v, fb = 0) => { const n = Number(v); return Number.isFinite(n) ? n : fb; };
            const parseTime = (raw) => {
                const s = String(raw).trim();
                if (s.endsWith('ms')) return parseFloat(s);
                if (s.endsWith('s')) return parseFloat(s) * 1000;
                const n = parseFloat(s);
                return Number.isFinite(n) ? n : 3000;
            };
            //------SOA------------
            // 총 시간 = 2*cycle + wait(=max(0, SOA - cycle))
            function totalMsFor(soaMs, cycleMs) {
                const waitMs = Math.max(0, soaMs - cycleMs);
                return 2 * cycleMs + waitMs;
            }

            // baseline은 “현재 주파수에서 SOA=50ms”로 두는 예시
            const BASELINE_SOA_MS = 50;

            // 거리 스케일 팩터: 현재 총시간 / 기준 총시간
            function distanceScale() {
                const { cycleMs, soaMs } = computeTiming();
                const baseTotal = totalMsFor(BASELINE_SOA_MS, cycleMs);
                const curTotal = totalMsFor(soaMs, cycleMs);
                return baseTotal > 0 ? (curTotal / baseTotal) : 1;
            }

            // ===== Elements =====

            const soaSelect = document.getElementById('soaSelect');
            const targetHzInput = document.getElementById('targetHz');
            const syncSOA = document.getElementById('syncSOA');


            const track = $('#track');
            const bar = $('#bar');
            const btnStartAnim = $('#startBtn');
            const phaseText = $('#phaseText');
            const btnConnect = $('#btnConnect');
            const btnStartSession = $('#btnStart');
            const btnDownload = $('#btnDownload');
            const statusBadge = $('#serialStatus');

            // 방향 패널 요소
            const labelA = $('#labelA');  // 좌/위/앞
            const labelB = $('#labelB');  // 우/아래/뒤
            const arrowLine = $('#arrowLine');

            // 방향 칩
            const chipLR = $('#chipLR');
            const chipUD = $('#chipUD');
            const chipFB = $('#chipFB');

            // ===== Serial State =====
            let port = null, writer = null, demo = false;

            function writerReady() {
                return !!(writer && typeof writer.write === 'function');
            }

            async function sendByte(n) {
                if (demo) { await sleep(5); return; }
                if (!writerReady()) {
                    console.warn('[Serial] writer가 준비되지 않음. 바이트 전송 생략:', n);
                    alert('시리얼이 연결되지 않았습니다. 먼저 "시리얼 연결"을 눌러주세요.');
                    return;
                }
                const buf = new Uint8Array([n & 0xff]);
                try { await writer.write(buf); }
                catch (e) {
                    console.error(e);
                    alert('Serial 연결 실패: 포트/권한을 확인하세요.\n' + (e?.message || e));
                }
            }

            async function connectSerial() {
                try {
                    demo = $('#demoMode')?.checked === true;
                    if (demo) { statusBadge.textContent = '데모'; statusBadge.classList.add('ok'); alert('데모 모드: 시리얼 없이 진행합니다.'); return; }
                    if (!('serial' in navigator)) { alert('이 브라우저는 Web Serial을 지원하지 않습니다. (크롬/엣지 권장)'); return; }
                    if (location.protocol !== 'https:' && !['localhost', '127.0.0.1'].includes(location.hostname)) {
                        alert('Web Serial은 HTTPS 또는 http://localhost 에서만 동작합니다.'); return;
                    }
                    const p = await navigator.serial.requestPort();
                    await p.open({ baudRate: 115200 });
                    // --- 읽기 스트림 준비 (라인 단위 파싱) ---
                    const textDecoder = new TextDecoderStream();
                    p.readable.pipeTo(textDecoder.writable);
                    const reader = textDecoder.readable.getReader();

                    (async () => {
                        let buf = '';
                        while (true) {
                            const { value, done } = await reader.read();
                            if (done) break;
                            if (value) {
                                buf += value;
                                let nl;
                                while ((nl = buf.indexOf('\n')) >= 0) {
                                    const line = buf.slice(0, nl).trim();
                                    buf = buf.slice(nl + 1);
                                    handleSerialLine(line);
                                }
                            }
                        }
                    })().catch(console.error);

                    if (!p.writable) { throw new Error('이 포트는 writable 스트림을 제공하지 않습니다.'); }
                    port = p; writer = port.writable.getWriter();
                    statusBadge.textContent = '연결됨'; statusBadge.classList.add('ok');
                    alert('시리얼 연결 성공: 이제 시작을 누르세요.');

                    window.addEventListener('beforeunload', async () => {
                        try { if (writer) { writer.releaseLock?.(); } await port?.close?.(); } catch (_) { }
                    }, { once: true });
                } catch (e) {
                    console.error(e);
                    alert('Serial 연결 실패: 포트/권한을 확인하세요.' + (e?.message || e));
                }
            }

            const rail = document.getElementById('rail');

            function measureWidths() {
                const trackW = ensureNumber(track?.clientWidth) || ensureNumber(track?.offsetWidth) || ensureNumber(track?.getBoundingClientRect?.().width);
                const railW = ensureNumber(rail?.clientWidth) || ensureNumber(rail?.offsetWidth) || ensureNumber(rail?.getBoundingClientRect?.().width) || trackW;
                const barW = ensureNumber(bar?.clientWidth) || ensureNumber(bar?.offsetWidth) || ensureNumber(bar?.getBoundingClientRect?.().width);
                return { trackW, railW, barW };
            }

            function computeTargets() {
                const { railW, barW } = measureWidths();
                const endLeft = Math.max(0, ensureNumber(railW - barW));
                return { start: 0, end: endLeft, ok: Number.isFinite(endLeft) && endLeft >= 0 };
            }

            function applyDistanceScale()
            {
              const { trackW, barW } = measureWidths();
              const k = distanceScale();
              const minRail = Math.max(barW, 40);
              const newRailW = Math.max(minRail, Math.round(trackW * k));

              rail.style.width = newRailW + 'px';

              const { start, end } = computeTargets();
              const cur = ensureNumber(parseFloat(getComputedStyle(bar).left), 0);
              bar.style.left = toPx(Math.max(start, Math.min(cur, end)));
            }

            //SoA
            function getSOAms() {
                return Number(soaSelect?.value ?? 50);
            }
            function getTargetHz() {
                const hz = Number(targetHzInput?.value ?? 40);
                return Number.isFinite(hz) && hz > 0 ? hz : 40;
            }
            function computeTiming() {
                const hz = getTargetHz();
                const cycleMs = 1000 / hz;                       // 1사이클 시간
                const soaMs = getSOAms();
                const waitMs = Math.max(0, soaMs - cycleMs);     // INO와 동일 로직
                return { hz, cycleMs, soaMs, waitMs };
            }
            function applyTimingToUI() {
                const { cycleMs } = computeTiming();
                // CSS 이동시간을 파형 1사이클로 맞춤 (시각-촉각 일관성)
                document.documentElement.style.setProperty('--move-duration', `${Math.round(cycleMs)}ms`);
            }
            // SOA 바뀌면: 속도(transition 시간)는 그대로, 레일 폭만 업데이트
            soaSelect?.addEventListener('change', () => {
                applyDistanceScale();
            });
            // Hz 바뀌면: 속도 갱신 + 레일도 재계산 (cycleMs가 바뀌면 distanceScale도 변함)
            targetHzInput?.addEventListener('input', () => {
                applyTimingToUI();     // 기존: --move-duration 업데이트(속도)
                applyDistanceScale();  // 추가: 레일 폭 갱신
            });

            // 초기 1회 적용
            applyTimingToUI();
            applyDistanceScale();

            // 창 크기 바뀔 때도 레일 재계산
            let resizeTimer = null;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    applyDistanceScale();
                }, 100);
            });

            async function maybeSleepSOA() {
                const { waitMs } = computeTiming();
                if (syncSOA?.checked) {
                    await sleep(waitMs); // UI만 실행 모드에서 두 동작 간 간격을 SOA에 맞춤
                }
            }

            function handleSerialLine(line) {
                // 예: [SOA] desired=50 ms, cycle=25.00 ms, wait=25 ms, effective≈50.00 ms
                const m = line.match(/\[SOA\].*desired\s*=\s*(\d+)\s*ms/i);
                if (m) {
                    const desired = m[1];
                    const opt = document.querySelector(`#soaSelect option[value="${desired}"]`);
                    if (opt) {
                        document.getElementById('soaSelect').value = desired;
                        applyTimingToUI();               // move-duration 재계산(Hz 반영)
                        // 대기 시간은 maybeSleepSOA()가 매번 computeTiming()으로 반영
                        console.log('[UI] Synced SOA from board ->', desired, 'ms');
                    }
                }

                // 필요 시 targetHz도 동기화하고 싶다면 보드에서 로그 찍고 여기에 정규식 추가
                // const mhz = line.match(/targetHz\s*=\s*([0-9.]+)/i); ...
            }

            //repulsive, attractive
            // === Response UI ===
            const btnRepulsive = document.getElementById('btnRepulsive');
            const btnAttractive = document.getElementById('btnAttractive');

            let awaitingResponse = false;
            let trialId = 0;

            function setResponseEnabled(on) {
              if (!btnRepulsive || !btnAttractive) return;
              btnRepulsive.disabled = !on;
              btnAttractive.disabled = !on;
              awaitingResponse = !!on;
              if (on && phaseText) phaseText.textContent = '응답 대기 (J/K)';
            }

            function recordSensation(label) {
              if (!awaitingResponse) return;
              const t = computeTiming(); // {hz, cycleMs, soaMs, waitMs}
              logEvent('label', {
                trial: trialId,
                sensation: label,           // 'repulsive' | 'attractive'
                soa_ms: t.soaMs,
                target_hz: t.hz,
                mode: selectedMode,
                dir: dirPreset
              });
              setResponseEnabled(false);
              if (phaseText) phaseText.textContent = '응답 기록됨';
            }

            // 버튼/키보드 바인딩
            btnRepulsive?.addEventListener('click', () => recordSensation('repulsive'));
            btnAttractive?.addEventListener('click', () => recordSensation('attractive'));
            document.addEventListener('keydown', (e) => {
              if (!awaitingResponse) return;
              const k = e.key?.toLowerCase?.();
              if (k === 'j') recordSensation('repulsive');
              if (k === 'k') recordSensation('attractive');
            });



            // ===== 타이밍 모드 =====
            let selectedMode = null; // 'uiOnly' | 'uiThenA' | 'aThenUi'
            const btnUIOnly = $('#btnUIOnly');
            const btnUIThenA = $('#btnUIThenA');
            const btnAThenUI = $('#btnAThenUI');

            function setMode(mode) {
                selectedMode = mode;
                [btnUIOnly, btnUIThenA, btnAThenUI].forEach(b => b && b.classList.remove('active'));
                if (mode === 'uiOnly' && btnUIOnly) btnUIOnly.classList.add('active');
                if (mode === 'uiThenA' && btnUIThenA) btnUIThenA.classList.add('active');
                if (mode === 'aThenUi' && btnAThenUI) btnAThenUI.classList.add('active');
            }
            if (btnUIOnly) btnUIOnly.addEventListener('click', () => setMode('uiOnly'));
            if (btnUIThenA) btnUIThenA.addEventListener('click', () => setMode('uiThenA'));
            if (btnAThenUI) btnAThenUI.addEventListener('click', () => setMode('aThenUi'));

            // ===== NEW: 방향 프리셋 상태 + 렌더 =====
            let dirPreset = 'LR'; // 'LR' | 'UD' | 'FB'

            function setDirPreset(preset) {
                dirPreset = preset;
                // 칩 액티브 토글
                [chipLR, chipUD, chipFB].forEach(c => c.classList.remove('active'));
                if (preset === 'LR') chipLR.classList.add('active');
                if (preset === 'UD') chipUD.classList.add('active');
                if (preset === 'FB') chipFB.classList.add('active');
                renderDirectionPanel();
            }

            function renderDirectionPanel() {
                switch (dirPreset) {
                    case 'LR':
                        labelA.textContent = '좌 (Left)';
                        arrowLine.textContent = '→→→→→→→→→→→→→→→→→→';
                        labelB.textContent = '우 (Right)';
                        break;
                    case 'UD':
                        labelA.textContent = '위 (Up)';
                        arrowLine.textContent = '↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑';
                        labelB.textContent = '아래 (Down)';
                        break;
                    case 'FB':
                        labelA.textContent = '앞 (Forward)';
                        arrowLine.textContent = '———————————————'; // 긴 대시로 전/후 표현
                        labelB.textContent = '뒤 (Backward)';
                        break;
                }
            }

            // ===== add near other helpers =====
            function setMoving(on) { bar.classList.toggle('moving', !!on); }


            chipLR.addEventListener('click', () => setDirPreset('LR'));
            chipUD.addEventListener('click', () => setDirPreset('UD'));
            chipFB.addEventListener('click', () => setDirPreset('FB'));

            // 초기 렌더
            renderDirectionPanel();

            // 요소 참조
            const scaleDistanceBySOA = document.getElementById('scaleDistanceBySOA');

            // SOA/Hz 변경 시 레이아웃 재계산
            soaSelect?.addEventListener('change', () => {
                // move-duration은 건드리지 않음 (속도 유지)
                const { start, end } = computeTargets();
                const cur = ensureNumber(parseFloat(getComputedStyle(bar).left), 0);
                bar.style.left = toPx(Math.max(start, Math.min(cur, end)));
            });

            targetHzInput?.addEventListener('input', () => { applyTimingToUI(); });
            scaleDistanceBySOA?.addEventListener('change', () => {
                // 즉시 효과를 보려면 바의 현재 위치도 새 범위 안으로 클램프
                const { start, end } = computeTargets();
                const cur = ensureNumber(parseFloat(getComputedStyle(bar).left), 0);
                bar.style.left = toPx(Math.max(start, Math.min(cur, end)));
            });


            // ===== Countdown (3,2,1) overlay =====
            async function showCountdown(sec = 3) {
                const el = document.getElementById('countdown');
                if (!el) { await sleep(sec * 1000); return; }
                el.classList.add('show');
                for (let n = sec; n >= 1; n--) {
                    el.textContent = String(n);
                    await sleep(1000);
                }
                el.classList.remove('show');
                el.textContent = '';
                await sleep(100);
            }

            // LR/RL용 방향 화살표(실제 이동 축은 그대로 수평)
            function setArrows(dir) { // dir: 'LR' or 'RL'
                lastUIDir = (dir === 'LR') ? 'LR' : 'RL';
                if (dirPreset === 'UD') {
                    // 시각 보조만 변경 (애니메이션은 그대로 수평)
                    arrowLine.textContent = dir === 'LR'
                        ? '↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑'
                        : '↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓';
                } else if (dirPreset === 'FB') {
                    arrowLine.textContent = dir === 'LR'
                        ? '⬈⬈⬈⬈⬈⬈⬈⬈⬈⬈⬈⬈⬈⬈⬈⬈⬈⬈⬈⬈⬈⬈'
                        : '⬋⬋⬋⬋⬋⬋⬋⬋⬋⬋⬋⬋⬋⬋⬋⬋⬋⬋⬋⬋⬋⬋';
                } else {
                    arrowLine.textContent = dir === 'LR'
                        ? '→→→→→→→→→→→→→→→→→→'
                        : '←←←←←←←←←←←←←←←←←←';
                }
            }

            // ❶ 유틸 추가 (문자열 전송)
            async function sendText(str) {
                if (demo) { await sleep(5); return; }
                if (!writerReady()) { alert('시리얼이 연결되지 않았습니다.'); throw new Error('serial not ready'); }
                const enc = new TextEncoder();
                await writer.write(enc.encode(str));
            }

            // ❷ 현재 SOA 값을 보드로 전송 ("S60\n" 같은 라인)
            // SOA 한 번만 전송 + 콘솔 로깅
            async function sendSOA() {
                const soaMs = Number(soaSelect?.value ?? 50);
                console.log('[UI] sendSOA ->', soaMs, 'ms');
                await sendText(`S${soaMs}\n`);
            }



            // ===== Experiment State & Log =====
            let running = false; // animation running
            let rows = [];
            let lastStimEnd = 0;

            function logEvent(kind, ext = {}) {
                const pid = ($('#pid').value || 'P00').toUpperCase();
                const rec = Object.assign({
                    timestamp: new Date().toISOString(),
                    participant_id: pid,
                    kind, // 'LR_start' | 'RL_start' | 'end' | 'cmdA_sent'
                    code: null,
                    side_byte: null,
                    demo_mode: demo ? 1 : 0
                }, ext);
                rows.push(rec);
                console.log('[LOG]', rec);
            }

            // ===== One-shot sequence: LR(100ms) → countdown 3s → RL(100ms) =====
            async function runSequenceOnce() {
                if (running) return;
                running = true;
                btnStartAnim.disabled = true;
                btnStartAnim.textContent = 'Running…';

                if (!demo && !writerReady()) {
                    alert('시리얼이 연결되지 않았습니다. 먼저 "시리얼 연결"을 눌러주세요.');
                    running = false; btnStartAnim.disabled = false; btnStartAnim.textContent = 'Start';
                    //return;
                }

                const { start, end, ok } = computeTargets();
                if (!ok) {
                    alert('레이아웃 측정 실패');
                    running = false; btnStartAnim.disabled = false; btnStartAnim.textContent = 'Start';
                    return;
                }

                // 위치 리셋
                bar.style.transition = 'none';
                bar.style.left = toPx(start);
                await new Promise(requestAnimationFrame);

                // === (Countdown) L→R ===
                phaseText.textContent = '곧 좌→우 이동';
                setArrows('LR');
                await showCountdown(3);

                // === L→R start ===
                phaseText.textContent = '좌→우 이동 중…';
                const codeLR = ensureNumber($('#codeLR').value, 0);
                const sideLR = ensureNumber($('#sideLR').value, 0);
                await sendByte(codeLR); await sendByte(sideLR);
                logEvent('LR_start', { code: codeLR, side_byte: sideLR });

                bar.style.transition = 'left var(--move-duration) linear';
                void bar.offsetWidth;
                bar.style.left = toPx(end);

                await new Promise(resolve => {
                    bar.addEventListener('transitionend', e => (e.propertyName === 'left') && resolve(), { once: true });
                });
                lastStimEnd = performance.now();

                // === (Countdown) R→L ===
                phaseText.textContent = '곧 우→좌 이동';
                setArrows('RL');
                await showCountdown(3);

                // === R→L start ===
                phaseText.textContent = '우→좌 이동 중…';
                const codeRL = ensureNumber($('#codeRL').value, 1);
                const sideRL = ensureNumber($('#sideRL').value, 1);
                await sendByte(codeRL); await sendByte(sideRL);
                logEvent('RL_start', { code: codeRL, side_byte: sideRL });
                void bar.offsetWidth;
                bar.style.left = toPx(start);

                await new Promise(resolve => {
                    bar.addEventListener('transitionend', e => (e.propertyName === 'left') && resolve(), { once: true });
                });

                phaseText.textContent = '완료';
                logEvent('end', { rt_ms: lastStimEnd ? Math.max(0, Math.round(performance.now() - lastStimEnd)) : '' });
                running = false; btnStartAnim.disabled = false; btnStartAnim.textContent = 'Start';
            }

            function getMoveMs() {
                return parseTime(getComputedStyle(document.documentElement).getPropertyValue('--move-duration'));
            }

            function waitForLeftTransition(el) {
                const dur = getMoveMs();
                return Promise.race([
                    new Promise(res => el.addEventListener('transitionend', e => {
                        if (e.propertyName === 'left') res();
                    }, { once: true })),
                    sleep(dur + 50)
                ]);
            }

            // ===== Send command 'A' to Arduino =====
            async function sendCommandA(delayMs = 0) {
                if (delayMs > 0) await sleep(delayMs);
                if (!demo && !writerReady()) { alert('시리얼이 연결되지 않았습니다.'); throw new Error('serial not ready'); }
                await sendSOA();
                const soaMs = Number(soaSelect?.value ?? 50);
                const enc = new TextEncoder();
                const payload = `S${soaMs}\nA\n`;     // <-- 바이트 혼용 X, 개행 포함 O
                await writer.write(enc.encode(payload));

                logEvent('cmdA_sent', { mode: selectedMode, soa_ms: soaMs, dir: dirPreset });
                console.log('[TX]', JSON.stringify(payload));
            }



            // ===== Orchestrators for timing modes =====
            function disableTimingBtns(dis) {
                const a = document.getElementById('btnUIOnly');
                const b = document.getElementById('btnUIThenA');
                const c = document.getElementById('btnAThenUI');
                if (a) a.disabled = dis; if (b) b.disabled = dis; if (c) c.disabled = dis;
            }

            // (1) A→UI : 먼저 A 전송, 그 다음 UI 전체 실행
            async function run_A_then_UI() {
                if (running) return; running = true; disableTimingBtns(true);
                try {
                    const { start, end, ok } = computeTargets(); if (!ok) { alert('레이아웃 측정 실패'); return; }
                    bar.style.transition = 'none'; bar.style.left = toPx(start);
                    await new Promise(requestAnimationFrame);

                    await showCountdown(3);
                    if (syncSOA?.checked) await maybeSleepSOA();
                    await sendCommandA(0);
                   // await delay(100);

                    phaseText.textContent = '좌→우 이동 중…'; setArrows('LR');
                    //setMoving(true);
                    bar.style.transition = 'left var(--move-duration) linear'; bar.style.left = toPx(end);
                    await new Promise(r => bar.addEventListener('transitionend', e => e.propertyName === 'left' && r(), { once: true }));


                    await showCountdown(3);
                    if (syncSOA?.checked) await maybeSleepSOA();
                    //setMoving(false);
                    await sendCommandA(0);
                    //await delay(100);

                    phaseText.textContent = '우→좌 이동 중…'; setArrows('RL');
                    //setMoving(true);
                    bar.style.left = toPx(start);
                    await new Promise(r => bar.addEventListener('transitionend', e => e.propertyName === 'left' && r(), { once: true }));
                    //setMoving(false);
                    phaseText.textContent = '완료';
                    setResponseEnabled(true);


                } finally { running = false; disableTimingBtns(false); }
            }

            // (2) UI 애니메이션만 실행
            async function run_UI_only() {
                if (running) return; running = true; disableTimingBtns(true);
                try {
                    const { start, end, ok } = computeTargets(); if (!ok) { alert('레이아웃 측정 실패'); return; }
                    bar.style.transition = 'none'; bar.style.left = toPx(start);
                    await new Promise(requestAnimationFrame);

                    await showCountdown(3);
                    if (syncSOA?.checked) await maybeSleepSOA();
                    await sendCommandA(0); // 요청대로 during 모드에서도 유지
                    //setMoving(true);
                    phaseText.textContent = '좌→우 이동 중…'; setArrows('LR');
                    bar.style.transition = 'left var(--move-duration) linear'; bar.style.left = toPx(end);
                    await new Promise(r => bar.addEventListener('transitionend', e => e.propertyName === 'left' && r(), { once: true }));
                    //setMoving(false);

                    //await showCountdown(3);
                    await (syncSOA?.checked ? maybeSleepSOA() : showCountdown(3));

                    phaseText.textContent = '우→좌 이동 중…'; setArrows('RL');
                    //setMoving(true);
                    bar.style.left = toPx(start);
                    await new Promise(r => bar.addEventListener('transitionend', e => e.propertyName === 'left' && r(), { once: true }));
                    //setMoving(false);

                    await sendCommandA(0);
                    phaseText.textContent = '완료';
                    setResponseEnabled(true);
                } finally { running = false; disableTimingBtns(false); }
            }

            // (3) UI→A : UI 끝난 직후 A 전송
            async function run_UI_then_A() {
                if (running) return; running = true; disableTimingBtns(true);
                try {
                    const { start, end, ok } = computeTargets();
                    if (!ok) { alert('레이아웃 측정 실패'); return; }
                    bar.style.transition = 'none'; bar.style.left = toPx(start);
                    await new Promise(requestAnimationFrame);

                    await showCountdown(3);
                    if (syncSOA?.checked) await maybeSleepSOA();

                    //setMoving(true);
                    phaseText.textContent = '좌→우 이동 중…'; setArrows('LR');
                    bar.style.transition = 'left var(--move-duration) linear';
                    await new Promise(requestAnimationFrame);
                    bar.style.left = toPx(end);
                    //setMoving(false);

                    await waitForLeftTransition(bar);
                    await sendCommandA(100);

                    await showCountdown(3);
                    if (syncSOA?.checked) await maybeSleepSOA();
                    //setMoving(true);
                    phaseText.textContent = '우→좌 이동 중…'; setArrows('RL');
                    bar.style.left = toPx(start);
                    await waitForLeftTransition(bar);
                    //setMoving(false);

                    await sendCommandA(100);

                    phaseText.textContent = '완료';
                    setResponseEnabled(true);
                } finally {
                    running = false; disableTimingBtns(false);
                }
            }

            const delay = (ms = 500) => new Promise(res => setTimeout(res, ms));

            // ===== CSV tools =====
            function toCSV(rows)
            {
              if (!rows.length) return '';
                const cols = [
                    'timestamp', 'participant_id', 'kind', 'trial',
                    'axis_preset', 'ui_dir',
                    'sensation',
                    'code', 'side_byte', 'demo_mode', 'rt_ms',
                    'soa_ms', 'target_hz', 'mode'
                ];
              const esc = v => { if (v == null) return ''; const s = String(v); return /[",\n]/.test(s) ? '"' + s.replaceAll('"','""') + '"' : s; };
              const header = cols.join(',');
              const body = rows.map(r => cols.map(c => esc(r[c])).join(',')).join('\n');
              return header + '\n' + body;
            }

            function axisPresetCSV() {
                return dirPreset; // 'LR' | 'UD' | 'FB' 그대로 저장 (또는 '좌우/상하/전후'로 바꾸고 싶으면 매핑)
            }

            function downloadBlob(text, filename, mime = 'text/csv;charset=utf-8;') {
                const blob = new Blob([text], { type: mime });
                const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); document.body.removeChild(a);
            }

            // 눌림 시각 피드백 바인딩 (옵션)
            function bindPressVisual(btn) {
                const add = () => btn.classList.add('is-pressed');
                const rem = () => btn.classList.remove('is-pressed');
                btn.addEventListener('mousedown', add);
                btn.addEventListener('mouseup', rem);
                btn.addEventListener('mouseleave', rem);
                btn.addEventListener('touchstart', add, { passive: true });
                btn.addEventListener('touchend', rem);
                btn.addEventListener('touchcancel', rem);
                btn.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') add(); });
                btn.addEventListener('keyup', rem);
            }
            document.querySelectorAll('.btn').forEach(bindPressVisual);

            // ===== Events =====
            btnConnect.addEventListener('click', connectSerial);
            btnStartSession.addEventListener('click', () => {
                demo = $('#demoMode')?.checked === true;
                alert(demo ? '데모 모드로 세션 시작' : '세션 시작');
            });
            btnDownload.addEventListener('click', () => {
                const csv = toCSV(rows);
                if (!csv) { alert('저장할 데이터가 없습니다'); return; }
                const pid = ($('#pid').value || 'P00').toUpperCase();
                downloadBlob(csv, `${pid}_onewaybar_serial.csv`);
            });

            btnStartAnim.addEventListener('click', async () =>
            {
              if (running) return;
              if (!selectedMode) { alert('먼저 모드를 선택하세요 (Before/During/After).'); return; }
              trialId += 1;                 // ★ 이번 시도 번호 증가
              setResponseEnabled(false);    // ★ 새 시도 시작 시 응답 잠금
              btnStartAnim.classList.add('latched','running');
              const prevText = btnStartAnim.textContent; btnStartAnim.textContent = 'Running…';
              try {
                if (selectedMode === 'uiOnly')      { await run_UI_only(); }
                else if (selectedMode === 'uiThenA'){ await run_UI_then_A(); }
                else if (selectedMode === 'aThenUi'){ await run_A_then_UI(); }
              } finally {
                btnStartAnim.classList.remove('running');
                btnStartAnim.textContent = prevText;
              }
            });


            // Dev quick tests
            (function devTests() {
                try {
                    console.assert(parseTime('3000ms') === 3000, 'parse ms');
                    console.assert(parseTime('3s') === 3000, 'parse s');
                    console.assert(toPx(10) === '10px', 'toPx');
                    const { trackW, barW } = measureWidths();
                    console.assert(Number.isFinite(trackW), 'trackW');
                    console.assert(Number.isFinite(barW), 'barW');
                    const sampleRows = [
                        { timestamp: '2025-09-23T00:00:00.000Z', participant_id: 'P01', kind: 'LR_start', code: 0, side_byte: 0, demo_mode: 0, rt_ms: 123 },
                        { timestamp: '2025-09-23T00:00:01.000Z', participant_id: 'P01', kind: 'end', code: '"X"', side_byte: 1, demo_mode: 1, rt_ms: 0 }
                    ];
                    const csv = toCSV(sampleRows);
                    console.assert(csv.includes('\n') && csv.split('\n').length === 3, 'CSV newline join');
                    console.assert(csv.includes('""X""'), 'CSV escaping of quotes');
                    console.assert(!writerReady(), 'writer should not be ready before connect');
                } catch (e) { console.warn('[tests]', e); }
            })();
        })();
    </script>
</body>
</html>
