<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Waveform Pulse → int16_t[256] (Classic UI)</title>
    <style>
        :root {
            --bg: #0b1020;
            --panel: #101933;
            --ink: #e6e9f2;
            --muted: #99a2c2;
            --accent: #7aa2ff;
            --good: #36d399;
            --warn: #ffb86b;
            --grid: rgba(255,255,255,.08);
            --midline: rgba(255,255,255,.25);
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: radial-gradient(1200px 800px at 70% -20%, #1a2458 0%, var(--bg) 60%);
            color: var(--ink);
            font-family: ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial
        }

        .wrap {
            max-width: 1200px;
            margin: 28px auto;
            padding: 0 16px
        }

        h1 {
            font-size: 22px;
            margin: 0 0 8px
        }

        p.hint {
            color: var(--muted);
            margin: 0 0 16px
        }

        .grid {
            display: grid;
            grid-template-columns: 1.25fr 1fr;
            gap: 16px
        }

        @media (max-width:1100px) {
            .grid {
                grid-template-columns: 1fr
            }
        }

        .card {
            background: linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,.25)
        }

            .card .hd {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 12px 14px;
                border-bottom: 1px solid rgba(255,255,255,.08)
            }

                .card .hd h2 {
                    font-size: 14px;
                    margin: 0;
                    color: var(--muted);
                    letter-spacing: .3px;
                    font-weight: 600
                }

            .card .bd {
                padding: 12px
            }

        canvas {
            width: 100%;
            height: 320px;
            background: conic-gradient(from 180deg at 0 0,#0e142b,#0d1330,#0f1433);
            border-radius: 14px;
            display: block;
            border: 1px solid rgba(255,255,255,.10)
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            margin-top: 10px
        }

            .toolbar .spacer {
                flex: 1
            }

        button, .chip, select, input[type=number], input[type=text], input[type=checkbox] {
            font: inherit
        }

        button {
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,.18);
            background: #15214a;
            color: var(--ink);
            cursor: pointer
        }

            button:hover {
                filter: brightness(1.08)
            }

            button:active {
                transform: translateY(1px)
            }

            button.primary {
                background: linear-gradient(145deg,#7aa2ff,#5f86ff);
                color: #04060e;
                border: 0;
                font-weight: 700
            }

            button.good {
                background: linear-gradient(145deg,#36d399,#4fe1b4);
                color: #04140e;
                border: 0;
                font-weight: 700
            }

            button.warn {
                background: linear-gradient(145deg,#ffb86b,#ff9e53);
                color: #140a04;
                border: 0;
                font-weight: 700
            }

        .out {
            width: 100%;
            min-height: 180px;
            font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
            font-size: 12.5px;
            line-height: 1.45;
            color: #ecf2ff;
            background: #0b0f22;
            border: 1px solid rgba(255,255,255,.10);
            border-radius: 12px;
            padding: 10px;
            white-space: pre;
            overflow: auto
        }

        .mini {
            font-size: 11.5px;
            color: var(--muted)
        }

        .two {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px
        }

        label.chip {
            display: flex;
            align-items: center;
            gap: 6px
        }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>Draw a single pulse → export as <span class="mini">C int16_t array</span></h1>
        <!--<p class="hint">“예전처럼 선으로 그려지는” 클래식 드로잉. Time-normalize로 그린 구간만 0..N-1에 맞춰 리샘플합니다.</p>-->

        <div class="grid">
            <div class="card">
                <div class="hd"><h2>Canvas</h2></div>
                <div class="bd">
                    <canvas id="pad" width="1024" height="340"></canvas>
                    <div class="toolbar">
                        <button id="undoBtn">Undo</button>
                        <button id="clearBtn" class="warn">Clear</button>
                        <div class="spacer"></div>
                        <label class="chip"><input type="checkbox" id="timeNorm" checked> Time-normalize</label>
                        <label class="chip"><input type="checkbox" id="normalize" checked> Normalize → 32767</label>
                        <label class="chip"><input type="checkbox" id="symZero" checked> Baseline 0 (DC 제거)</label>
                        <label class="chip">Stroke: <input id="strokeWidth" type="number" value="2" min="1" max="8" style="width:60px"> px</label>
                    </div>

                    <div class="toolbar" style="margin-top:12px">
                        <label>Samples <input type="number" id="nSamples" value="256" min="8" max="4096" step="8" style="width:92px" /></label>
                        <label style="margin-left:10px">Variable name <input type="text" id="varName" placeholder="newWave_custom" value="newWave_custom" style="width:220px" /></label>
                        <div class="spacer"></div>
                        <button id="exportBtn" class="good">Export C Array</button>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="hd"><h2>Outputs</h2></div>
                <div class="bd">
                    <div class="two">
                        <div>
                            <div class="mini" style="margin-bottom:6px">C Array (definition)</div>
                            <pre class="out" id="outArray">// Export will appear here…</pre>
                            <div class="toolbar">
                                <button id="copyArray" class="primary">Copy</button>
                                <button id="dlCpp">Download CPP snippet</button>
                            </div>
                        </div>
                        <div>
                            <div class="mini" style="margin-bottom:6px">Header extern + CPP definition (for waveforms.h/.cpp)</div>
                            <pre class="out" id="outSnippets">// Header extern and CPP definition will appear here…</pre>
                            <div class="toolbar">
                                <button id="copySnip" class="primary">Copy Snippets</button>
                                <button id="dlH">Download waveforms.h add</button>
                                <button id="dlCPPFull">Download waveforms.cpp add</button>
                            </div>
                            <div class="mini" id="fsNote" style="margin-top:6px"></div>
                            <div class="toolbar">
                                <button id="writeH">Append to waveforms.h…</button>
                                <button id="writeCPP">Append to waveforms.cpp…</button>
                            </div>
                        </div>
                    </div>
                    <div class="toolbar" style="margin-top:10px">
                        <button id="exampleBtn">Load example pulse</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function () {
            const pad = document.getElementById('pad');
            const ctx = pad.getContext('2d');
            const W = pad.width, H = pad.height, mid = Math.round(H / 2);

            // Classic: one y per x-column, NaN = untouched
            let colY = new Array(W).fill(NaN);
            let history = [];
            let drawing = false, lastX = null, lastY = null;

            function pushHistory() { history.push(colY.slice()); if (history.length > 50) history.shift(); }
            function lerp(a, b, t) { return a + (b - a) * t; }

            function drawGrid() {
                ctx.clearRect(0, 0, W, H);
                // grid
                ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--grid');
                ctx.lineWidth = 1; ctx.beginPath();
                for (let x = 0; x <= W; x += 64) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
                for (let y = 0; y <= H; y += 40) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
                ctx.stroke();
                // midline
                ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--midline');
                ctx.beginPath(); ctx.moveTo(0, mid + 0.5); ctx.lineTo(W, mid + 0.5); ctx.stroke();
                // waveform preview (classic line)
                renderPreview();
            }

            function renderPreview() {
                ctx.save(); ctx.beginPath(); let started = false;
                const lw = parseInt(document.getElementById('strokeWidth').value || '2', 10);
                for (let x = 0; x < W; x++) {
                    let y = colY[x];
                    if (Number.isNaN(y)) continue;
                    if (!started) { ctx.moveTo(x, y); started = true; } else { ctx.lineTo(x, y); }
                }
                ctx.strokeStyle = '#9ad1ff';
                ctx.lineWidth = lw;
                ctx.lineJoin = 'round'; ctx.lineCap = 'round';
                ctx.stroke(); ctx.restore();
            }

            function pointerPos(e) {
                const r = pad.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                let x = Math.round((clientX - r.left) * (W / r.width));
                let y = Math.round((clientY - r.top) * (H / r.height));
                x = Math.max(0, Math.min(W - 1, x));
                y = Math.max(0, Math.min(H - 1, y));
                return { x, y };
            }

            function startDraw(e) { e.preventDefault(); pushHistory(); drawing = true; const { x, y } = pointerPos(e); lastX = x; lastY = y; colY[x] = y; drawGrid(); }
            function moveDraw(e) {
                if (!drawing) return;
                const { x, y } = pointerPos(e);
                if (x === lastX) { colY[x] = y; lastY = y; drawGrid(); return; }
                const x0 = lastX, y0 = lastY, x1 = x, y1 = y, step = (x1 > x0 ? 1 : -1);
                for (let xi = x0; xi !== x1 + step; xi += step) {
                    const t = (xi - x0) / (x1 - x0);
                    colY[xi] = Math.round(lerp(y0, y1, t));
                }
                lastX = x; lastY = y; drawGrid();
            }
            function endDraw() { drawing = false; lastX = null; lastY = null; }

            pad.addEventListener('mousedown', startDraw);
            pad.addEventListener('mousemove', moveDraw);
            window.addEventListener('mouseup', endDraw);
            pad.addEventListener('touchstart', startDraw, { passive: false });
            pad.addEventListener('touchmove', moveDraw, { passive: false });
            pad.addEventListener('touchend', endDraw);

            document.getElementById('strokeWidth').addEventListener('change', drawGrid);
            document.getElementById('undoBtn').addEventListener('click', () => { if (history.length) { colY = history.pop(); drawGrid(); } });
            document.getElementById('clearBtn').addEventListener('click', () => { pushHistory(); colY.fill(NaN); drawGrid(); outArray.textContent = '// cleared'; outSnippets.textContent = '// cleared'; });

            document.getElementById('exampleBtn').addEventListener('click', () => {
                pushHistory(); colY.fill(NaN);
                // asymmetric pulse demo
                const cx = Math.floor(W * 0.45), rise = 60, fall = 180, amp = Math.floor(H * 0.35);
                for (let i = -rise; i <= fall; i++) {
                    const x = cx + i; if (x < 0 || x >= W) continue; let y;
                    if (i < 0) { const t = (i + rise) / rise; y = mid - amp * (0.2 + 0.8 * t * t); }
                    else { const t = i / fall; y = mid - amp * Math.exp(-4 * t); }
                    colY[x] = Math.round(y);
                }
                drawGrid();
            });

            function interpolateGaps(arr) {
                // Fill leading/trailing NaNs with mid, and interior gaps by linear interpolation
                let i = 0; while (i < W && Number.isNaN(arr[i])) i++;
                for (let k = 0; k < i; k++) arr[k] = mid;
                while (i < W) {
                    let j = i + 1; while (j < W && Number.isNaN(arr[j])) j++;
                    if (j >= W) { for (let k = i + 1; k < W; k++) arr[k] = mid; break; }
                    const yi = arr[i], yj = arr[j], n = j - i;
                    for (let k = 1; k < n; k++) arr[i + k] = Math.round(lerp(yi, yj, k / n));
                    i = j;
                }
            }

            // === Export logic ===
            const outArray = document.getElementById('outArray');
            const outSnippets = document.getElementById('outSnippets');

            function sanitizeVarName(s) {
                s = (s || '').trim();
                if (!s) s = 'newWave_custom';
                s = s.replace(/[^A-Za-z0-9_]/g, '_');
                if (!/^[A-Za-z_]/.test(s)) s = '_' + s;
                return s;
            }

            function buildSamples() {
                const n = parseInt(document.getElementById('nSamples').value || '256', 10);
                const normalize = document.getElementById('normalize').checked;
                const symZero = document.getElementById('symZero').checked;
                const timeNorm = document.getElementById('timeNorm').checked;

                // Fill gaps
                const y = colY.slice(); interpolateGaps(y);

                // canvas y -> [-1,1] (up positive)
                const vFull = new Float64Array(W);
                for (let x = 0; x < W; x++) {
                    let v = (mid - y[x]) / mid; // top=+1, mid=0, bottom=-1
                    if (symZero && Math.abs(v) < 1e-4) v = 0;
                    vFull[x] = v;
                }

                function resampleRange(arr, a, b, n) {
                    const out = new Float64Array(n);
                    const span = Math.max(1, b - a);
                    for (let i = 0; i < n; i++) {
                        const xf = a + (i * span) / (n - 1);
                        const x0 = Math.floor(xf);
                        const x1 = Math.min(arr.length - 1, x0 + 1);
                        const t = xf - x0;
                        out[i] = lerp(arr[x0], arr[x1], t);
                    }
                    return out;
                }

                // time-norm
                let samples;
                if (timeNorm) {
                    const thr = 1e-3; let i0 = 0, i1 = W - 1;
                    while (i0 < W && Math.abs(vFull[i0]) <= thr) i0++;
                    while (i1 > i0 && Math.abs(vFull[i1]) <= thr) i1--;
                    samples = (i1 <= i0) ? new Float64Array(n) : resampleRange(vFull, i0, i1, n);
                    //if (n >= 2) { samples[0] = 0; samples[n - 1] = 0; }
                } else {
                    samples = resampleRange(vFull, 0, W - 1, n);
                }

                // amplitude normalize + quantize
                let scale = 32767;
                if (normalize) {
                    let peak = 0; for (let i = 0; i < n; i++) peak = Math.max(peak, Math.abs(samples[i]));
                    scale = peak > 0 ? 32767 / peak : 0;
                }
                const q = new Int16Array(n);
                for (let i = 0; i < n; i++) {
                    let val = Math.round(samples[i] * scale);
                    if (val > 32767) val = 32767; if (val < -32768) val = -32768; q[i] = val;
                }
                return q;
            }

            function formatNumbers(q) {
                const cols = 9; let s = '';
                for (let i = 0; i < q.length; i++) {
                    s += (i % cols === 0 ? '  ' : ' ') + q[i] + (i < q.length - 1 ? ',' : '');
                    if (i % cols === cols - 1 || i === q.length - 1) s += '\n';
                }
                return s;
            }
            function formatCArray(name, q) {
                return `int16_t ${name}[${q.length}] = {\n${formatNumbers(q)}};`;
            }
            function formatHeaderExtern(name, q) {
                return `// waveforms.h addition\nextern int16_t ${name}[${q.length}];`;
            }
            function formatCppDefinition(name, q) {
                return `// waveforms.cpp addition\nint16_t ${name}[${q.length}] = {\n${formatNumbers(q)}};`;
            }

            function doExport() {
                const name = sanitizeVarName(document.getElementById('varName').value);
                document.getElementById('varName').value = name;
                const q = buildSamples();
                const arrText = formatCArray(name, q);
                outArray.textContent = arrText;
                const snip = formatHeaderExtern(name, q) + "\n\n" + formatCppDefinition(name, q);
                outSnippets.textContent = snip;
            }

            document.getElementById('exportBtn').addEventListener('click', doExport);
            document.getElementById('copyArray').addEventListener('click', async () => { try { await navigator.clipboard.writeText(outArray.textContent.trim()); } catch { } });
            document.getElementById('copySnip').addEventListener('click', async () => { try { await navigator.clipboard.writeText(outSnippets.textContent.trim()); } catch { } });

            function downloadText(filename, text) {
                const blob = new Blob([text], { type: 'text/plain' }); const a = document.createElement('a');
                a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a);
                a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 0);
            }
            document.getElementById('dlCpp').addEventListener('click', () => {
                const name = sanitizeVarName(document.getElementById('varName').value);
                const q = buildSamples(); downloadText(`${name}.cpp.txt`, formatCppDefinition(name, q) + '\n');
            });
            document.getElementById('dlH').addEventListener('click', () => {
                const name = sanitizeVarName(document.getElementById('varName').value);
                const q = buildSamples(); downloadText('waveforms_h_addition.txt', formatHeaderExtern(name, q) + '\n');
            });
            document.getElementById('dlCPPFull').addEventListener('click', () => {
                const name = sanitizeVarName(document.getElementById('varName').value);
                const q = buildSamples(); downloadText('waveforms_cpp_addition.txt', formatCppDefinition(name, q) + '\n');
            });

            // File System Access (Chromium)
            const fsNote = document.getElementById('fsNote');
            fsNote.textContent = (window.showOpenFilePicker ? 'File write available (Chromium). ' : 'Direct file write unavailable. ');

            async function appendToPickedFile(snippet) {
                if (!window.showOpenFilePicker) { alert('File System Access API not available.'); return; }
                try {
                    const [h] = await window.showOpenFilePicker({ types: [{ description: 'C/C++ header or source', accept: { 'text/plain': ['.h', '.hpp', '.hh', '.cpp', '.cxx', '.cc'] } }] });
                    const file = await h.getFile(); let existing = await file.text();
                    // Avoid simple duplicates
                    if (existing.includes(snippet.trim())) { alert('This snippet seems already present.'); return; }

                    // If header and has #endif, insert before
                    if (/\.(h|hpp|hh)$/i.test(file.name)) {
                        const externLine = snippet.split('\n').find(l => /^\s*extern\s+int16_t\s+/.test(l)) || snippet;
                        const endifIdx = existing.lastIndexOf('#endif');
                        const insertion = (existing.endsWith('\n') ? '' : '\n') + externLine + '\n';
                        if (endifIdx !== -1) {
                            existing = existing.slice(0, endifIdx) + insertion + existing.slice(endifIdx);
                        } else {
                            existing += insertion;
                        }
                    } else {
                        existing += (existing.endsWith('\n') ? '' : '\n') + snippet.trim() + '\n';
                    }
                    const w = await h.createWritable(); await w.write(existing); await w.close();
                    alert('Appended successfully.');
                } catch (e) { console.warn(e); }
            }
            document.getElementById('writeH').addEventListener('click', () => {
                const name = sanitizeVarName(document.getElementById('varName').value);
                const q = buildSamples(); appendToPickedFile(formatHeaderExtern(name, q));
            });
            document.getElementById('writeCPP').addEventListener('click', () => {
                const name = sanitizeVarName(document.getElementById('varName').value);
                const q = buildSamples(); appendToPickedFile(formatCppDefinition(name, q));
            });

            // first draw
            drawGrid();
        })();
    </script>
</body>
</html>
