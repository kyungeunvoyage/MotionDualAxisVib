<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Draw a Pulse → int16_t (auto-append to .h/.cpp)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        body {
            font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
            margin: 16px;
        }

        .row {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .col {
            flex: 1 1 360px;
            min-width: 320px;
        }

        #canvas {
            border: 1px solid #ccc;
            touch-action: none;
            background: #fff;
        }

        label {
            display: block;
            margin: 8px 0 4px;
            font-weight: 600;
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }

        .btn {
            padding: 8px 12px;
            margin: 6px 6px 0 0;
            cursor: pointer;
        }

        textarea {
            width: 100%;
            min-height: 160px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        }

        .hint {
            color: #555;
            font-size: 12px;
        }

        .pill {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 999px;
            background: #f1f1f1;
            margin-left: 6px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h2>Draw a Pulse → <code>int16_t dat[N]</code> (Time-normalized)</h2>

    <div class="row">
        <div class="col">
            <canvas id="canvas" width="900" height="260"></canvas>
            <div class="hint">마우스/펜으로 한 번의 펄스를 그리세요. 우클릭 또는 “Clear”로 초기화.</div>

            <div class="row" style="align-items:flex-end;margin-top:8px;">
                <div class="col">
                    <label>Variable name <span class="pill">C identifier</span></label>
                    <input id="varName" type="text" placeholder="e.g., newWave_custom" value="newWave_custom">
                </div>
                <div class="col">
                    <label>Samples (N)</label>
                    <input id="nSamples" type="number" min="8" max="4096" step="1" value="256">
                </div>
            </div>

            <div style="margin-top:8px;">
                <label><input type="checkbox" id="optTimeNorm" checked> Time-normalize (trim to active region → resample to N)</label>
                <label><input type="checkbox" id="optPeakNorm" checked> Normalize peak to 32767</label>
                <label><input type="checkbox" id="optBaselineZero" checked> Force baseline ≈ 0</label>
            </div>

            <div style="margin-top:8px;">
                <button class="btn" id="btnExport">Export</button>
                <button class="btn" id="btnClear">Clear</button>
                <button class="btn" id="btnExample">Load example pulse</button>
            </div>
        </div>

        <div class="col">
            <label>Header extern (waveforms.h)</label>
            <textarea id="outHeader" readonly></textarea>
            <button class="btn" id="copyHeader">Copy C Header Snippet</button>
            <button class="btn" id="appendHeader">Append to waveforms.h…</button>

            <label style="margin-top:12px;">CPP definition (waveforms.cpp)</label>
            <textarea id="outCpp" readonly></textarea>
            <button class="btn" id="copyCpp">Copy CPP Definition</button>
            <button class="btn" id="appendCpp">Append to waveforms.cpp…</button>
        </div>
    </div>

    <p class="hint">
        ※ 파일 자동 추가는 Chrome/Edge 등 File System Access API 지원 브라우저에서만 동작합니다.
        동작 순서: <b>Export</b> → <b>Append to waveforms.h</b> → <b>Append to waveforms.cpp</b> → 빌드.
    </p>

    <script>
        (function () {
            // ===== Canvas drawing buffer =====
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            const W = canvas.width, H = canvas.height;
            let drawing = false;
            // internal buffer at pixel resolution: y in [-1..1], baseline ~0 when untouched = 0
            const buf = new Float32Array(W).fill(0);

            function yFromScreen(y) {
                // screen y (0..H) to normalized value [-1..1], up positive
                const v = 1 - (y / H) * 2;
                return Math.max(-1, Math.min(1, v));
            }

            function drawAll() {
                ctx.clearRect(0, 0, W, H);
                // grid
                ctx.strokeStyle = '#f0f0f0'; ctx.lineWidth = 1;
                for (let i = 1; i < 6; i++) {
                    const y = i * H / 6;
                    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
                }
                // axis 0
                ctx.strokeStyle = '#ddd';
                const y0 = H / 2;
                ctx.beginPath(); ctx.moveTo(0, y0); ctx.lineTo(W, y0); ctx.stroke();

                // waveform
                ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
                ctx.beginPath();
                for (let x = 0; x < W; x++) {
                    const v = buf[x];
                    const sy = (1 - (v + 1) / 2) * H;
                    if (x === 0) ctx.moveTo(0, sy);
                    else ctx.lineTo(x, sy);
                }
                ctx.stroke();
            }

            function setPoint(x, yNorm) {
                x = Math.max(0, Math.min(W - 1, x | 0));
                buf[x] = yNorm;
            }

            function lerp(a, b, t) { return a + (b - a) * t; }

            function onPointerDown(e) {
                e.preventDefault();
                if (e.button === 2) { // right click to clear
                    clearBuf();
                    return;
                }
                drawing = true;
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                setPoint(x, yFromScreen(y));
                drawAll();
            }

            function onPointerMove(e) {
                if (!drawing) return;
                const rect = canvas.getBoundingClientRect();
                let x = e.clientX - rect.left;
                let y = e.clientY - rect.top;
                const yN = yFromScreen(y);

                // interpolate if skipping pixels
                const prev = onPointerMove.prevX ?? x;
                const start = Math.max(0, Math.min(W - 1, Math.floor(Math.min(prev, x))));
                const end = Math.max(0, Math.min(W - 1, Math.ceil(Math.max(prev, x))));
                if (end >= start) {
                    for (let xi = start; xi <= end; xi++) {
                        const t = (end === start) ? 1 : (xi - start) / (end - start);
                        const v = lerp(buf[xi], yN, t); // blend to reduce gaps
                        buf[xi] = v;
                    }
                }
                onPointerMove.prevX = x;
                drawAll();
            }
            function onPointerUp() { drawing = false; onPointerMove.prevX = undefined; }

            function clearBuf() {
                buf.fill(0);
                drawAll();
            }

            canvas.addEventListener('contextmenu', e => e.preventDefault());
            canvas.addEventListener('mousedown', onPointerDown);
            canvas.addEventListener('mousemove', onPointerMove);
            window.addEventListener('mouseup', onPointerUp);
            drawAll();

            // ===== Controls =====
            const varNameEl = document.getElementById('varName');
            const nSamplesEl = document.getElementById('nSamples');
            const optTimeNorm = document.getElementById('optTimeNorm');
            const optPeakNorm = document.getElementById('optPeakNorm');
            const optBaselineZero = document.getElementById('optBaselineZero');

            document.getElementById('btnClear').onclick = clearBuf;

            document.getElementById('btnExample').onclick = () => {
                // simple asymmetric pulse example in center
                buf.fill(0);
                const a = Math.floor(W * 0.35), b = Math.floor(W * 0.65);
                for (let x = a; x <= b; x++) {
                    const t = (x - a) / (b - a);
                    const v = Math.sin(Math.PI * t) * (0.2 + 0.8 * t); // rising amplitude
                    buf[x] = Math.max(0, Math.min(1, v)); // positive-only
                }
                drawAll();
            };

            // ===== Export → int16_t =====
            const outHeader = document.getElementById('outHeader');
            const outCpp = document.getElementById('outCpp');

            document.getElementById('btnExport').onclick = () => {
                const name = sanitizeName(varNameEl.value || 'newWave_custom');
                varNameEl.value = name; // reflect

                const N = clamp(parseInt(nSamplesEl.value || '256', 10), 8, 4096);
                nSamplesEl.value = String(N);

                // 1) Get active region
                let lo = 0, hi = W - 1;
                if (optTimeNorm.checked) {
                    const thr = 1e-3;
                    while (lo < W && Math.abs(buf[lo]) <= thr) lo++;
                    while (hi >= 0 && Math.abs(buf[hi]) <= thr) hi--;
                    if (hi <= lo) { lo = 0; hi = W - 1; } // fallback: whole range
                }

                // 2) Sample → resample to N
                const raw = [];
                for (let i = 0; i < N; i++) {
                    const t = (N === 1) ? 0 : i / (N - 1); // 0..1
                    const x = lerp(lo, hi, t);
                    const ix0 = Math.floor(x), ix1 = Math.min(W - 1, ix0 + 1);
                    const frac = x - ix0;
                    const v = lerp(buf[ix0], buf[ix1], frac);
                    raw.push(v);
                }

                // 3) Baseline & Peak normalize
                let arr = raw.slice();
                if (optBaselineZero.checked) {
                    // remove DC offset
                    const mean = arr.reduce((s, v) => s + v, 0) / arr.length;
                    for (let i = 0; i < arr.length; i++) arr[i] -= mean;
                }
                if (optPeakNorm.checked) {
                    const peak = Math.max(1e-9, ...arr.map(v => Math.abs(v)));
                    for (let i = 0; i < arr.length; i++) arr[i] /= peak;
                }

                // 4) map to int16_t range [-32767..32767]
                const i16 = arr.map(v => {
                    const x = Math.max(-1, Math.min(1, v));
                    return Math.round(x * 32767);
                });

                // 5) format outputs
                outHeader.value = formatHeader(name, N);
                outCpp.value = formatCpp(name, i16);
            };

            function sanitizeName(s) {
                // valid C identifier: letters, digits, underscore; not starting with digit
                s = s.replace(/[^A-Za-z0-9_]/g, '_');
                if (/^[0-9]/.test(s)) s = '_' + s;
                if (!s) s = 'newWave_custom';
                return s;
            }
            function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

            function formatHeader(name, N) {
                return `// Auto-generated extern (do not duplicate)\nextern int16_t ${name}[${N}];\n`;
            }
            function formatCpp(name, data) {
                const lines = [];
                const perLine = 15;
                for (let i = 0; i < data.length; i += perLine) {
                    const slice = data.slice(i, i + perLine);
                    lines.push('  ' + slice.map((v, idx) => String(v)).join(', ') + (i + perLine < data.length ? ',' : ''));
                }
                return `// ${name} (auto-generated)\nint16_t ${name}[${data.length}] = {\n${lines.join('\n')}\n};\n`;
            }

            // Copy buttons
            document.getElementById('copyHeader').onclick = () => copyText(outHeader.value);
            document.getElementById('copyCpp').onclick = () => copyText(outCpp.value);

            async function copyText(txt) {
                try { await navigator.clipboard.writeText(txt); alert('Copied!'); }
                catch { // fallback
                    const ta = document.createElement('textarea');
                    ta.value = txt; document.body.appendChild(ta); ta.select();
                    document.execCommand('copy'); ta.remove(); alert('Copied (fallback)!');
                }
            }

            // ===== File append (File System Access API) =====
            const hasFS = 'showOpenFilePicker' in window;
            document.getElementById('appendHeader').onclick = async () => {
                if (!hasFS) return alert('This browser does not support file write. Use Chrome/Edge.');
                if (!outHeader.value.trim()) return alert('먼저 Export를 눌러서 내용을 생성하세요.');
                const [handle] = await window.showOpenFilePicker({
                    types: [{ description: 'C/C++ header', accept: { 'text/plain': ['.h'] } }],
                    excludeAcceptAllOption: false, multiple: false
                });
                let txt = await (await handle.getFile()).text();
                const externLine = outHeader.value.trim().split('\n').pop(); // last line is extern
                if (txt.includes(externLine.replace(/\/\/.*\n?/g, ''))) {
                    alert('Header already contains this extern.');
                    return;
                }
                // insert before #endif if present
                const endifIdx = txt.lastIndexOf('#endif');
                const insertion = (txt.endsWith('\n') ? '' : '\n') + externLine + '\n';
                if (endifIdx !== -1) {
                    txt = txt.slice(0, endifIdx) + insertion + txt.slice(endifIdx);
                } else {
                    txt += insertion;
                }
                const w = await handle.createWritable();
                await w.write(txt); await w.close();
                alert('Extern appended to header.');
            };

            document.getElementById('appendCpp').onclick = async () => {
                if (!hasFS) return alert('This browser does not support file write. Use Chrome/Edge.');
                if (!outCpp.value.trim()) return alert('먼저 Export를 눌러서 내용을 생성하세요.');
                const [handle] = await window.showOpenFilePicker({
                    types: [{ description: 'C++ source', accept: { 'text/plain': ['.cpp'] } }],
                    excludeAcceptAllOption: false, multiple: false
                });
                let txt = await (await handle.getFile()).text();

                // Dup check by variable name
                const name = (document.getElementById('varName').value || '').trim();
                const rx = new RegExp(`\\bint16_t\\s+${sanitizeName(name)}\\s*\\[`, 'm');
                if (rx.test(txt)) {
                    alert('CPP already contains this variable.');
                    return;
                }
                txt += (txt.endsWith('\n') ? '' : '\n') + outCpp.value.trim() + '\n';
                const w = await handle.createWritable();
                await w.write(txt); await w.close();
                alert('Definition appended to cpp.');
            };

        })();
    </script>
</body>
</html>
